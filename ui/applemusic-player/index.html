<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YouLy+ · AMLL 播放器预览</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#15131a;color:#fff;font:16px system-ui}
  article{position:fixed;inset:0;background:linear-gradient(140deg,#342041,#172442);display:grid;place-items:center}
  .preview-native{text-align:center}.preview-native button,.preview-launch{padding:12px 20px;border:1px solid #ffffff40;border-radius:12px;background:#ffffff14;color:#fff;cursor:pointer}
  .preview-launch{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%)}
  body:has(article) .preview-launch{display:none}
  .preview-note{position:fixed;bottom:8px;left:12px;z-index:10002;font-size:11px;color:#fff8;pointer-events:none}
</style></head>
<body><button class="preview-launch" id="preview-open">打开播放器</button><div class="preview-note">本地演示 · 逐词 / 逐行 / 纯文本 / 无歌词示例，可用上一首与下一首切换</div><script type="module" src="/preview.mjs"></script></body>
</html>
